name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: tl-darwin-aarch64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: tl-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: tl-windows-x64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch Dependencies
        run: cargo fetch --locked

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename artifact
        shell: bash
        run: |
          SRC="target/${{ matrix.target }}/release/tl${{ matrix.target == 'x86_64-pc-windows-msvc' && '.exe' || '' }}"
          DST="target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          mv "$SRC" "$DST"

      - name: Generate SHA256
        shell: pwsh
        run: |
          $file = "target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()
          "$hash  ${{ matrix.artifact }}" | Out-File -FilePath "$file.sha256" -Encoding ascii

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/${{ matrix.target }}/release/${{ matrix.artifact }}
            target/${{ matrix.target }}/release/${{ matrix.artifact }}.sha256

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
