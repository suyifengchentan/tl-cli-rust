[package]
name = "tlcli"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A wget-like CLI download tool powered by TaiLerDownloader"

[[bin]]
name = "tl"
path = "src/main.rs"

[dependencies]
TaiLerDownloader = { git = "https://github.com/suyifengchentan/TaiLerDownloader.git", default-features = false, features = ["ftp", "torrent", "ed2k"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal"] }
clap = { version = "4", features = ["derive"] }
indicatif = { version = "0.17", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
once_cell = "1"
url = "2"
dirs = "6"
